name: quality
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features allow-private-upstream -- -D warnings
      - run: cargo test --locked --all-targets --features allow-private-upstream
      - run: cargo clippy --locked --all-targets --features p2p -- -D warnings
      - run: cargo test --locked --all-targets --features p2p
      - run: cargo test --locked --lib --features p2p-network,allow-private-upstream p2p_network::tests
      - run: cargo bench --locked --no-run
      - run: cargo check --locked --all-targets
      - run: git diff --check
  feature-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: p2p-librqbit
            runner: ubuntu-latest
          # The bridge is checked independently from the already-covered
          # librqbit graph. The Android NDK build itself is enforced by mobile.yml.
          - features: android-jni
            runner: macos-14
          - features: harmony-napi
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: contains(matrix.features, 'android-jni')
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy (${{ matrix.features }})
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --locked --lib --features '${{ matrix.features }}' -- -D warnings 2>&1 | tee clippy.log; then
            details="$(tail -n 40 clippy.log | perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Clippy failed (${{ matrix.features }})::$details"
            exit 1
          fi
      # Platform runtimes provide JNI/N-API symbols when loading the final library.
      # A host-side lib test validates Rust code without linking a macOS/Linux cdylib.
      - run: cargo test --locked --lib --features '${{ matrix.features }}'
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-audit
      # librqbit 8.1.1 pulls quick-xml 0.37 through librqbit-upnp. The affected
      # UPnP parser is unreachable because enable_upnp_port_forwarding=false.
      # Remove these exceptions when stable librqbit uses quick-xml >= 0.41.
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/*.sh
      - run: ./scripts/verify-release-version.sh
      - run: ./scripts/verify-release-assets.sh --self-test
  ffi-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/test-ffi-macos.sh
