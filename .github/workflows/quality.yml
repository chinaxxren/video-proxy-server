name: quality
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features allow-private-upstream -- -D warnings
      - run: cargo test --locked --all-targets --features allow-private-upstream
      - run: cargo clippy --locked --all-targets --features p2p -- -D warnings
      - run: cargo test --locked --all-targets --features p2p
      - run: cargo check --locked --all-targets
      - run: git diff --check
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - p2p-librqbit
          - p2p-librqbit,android-jni
          - p2p-librqbit,harmony-napi
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --locked --lib --features '${{ matrix.features }}' -- -D warnings
      # Platform runtimes provide JNI/N-API symbols when loading the final library.
      # A host-side lib test validates Rust code without linking a macOS/Linux cdylib.
      - run: cargo test --locked --lib --features '${{ matrix.features }}'
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/build-mobile.sh scripts/package-mobile.sh
  ffi-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/test-ffi-macos.sh
