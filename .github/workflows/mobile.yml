name: mobile-native

on:
  workflow_dispatch:
    inputs:
      include_p2p:
        description: Build the explicitly optional P2P variant
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-14
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build iOS libraries
        run: PLATFORM=ios ./scripts/build-mobile.sh dist/mobile
      - name: Archive iOS artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}.tar.gz -C dist/mobile ios ios-sim include build-features.txt
          shasum -a 256 media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}.*

  android:
    runs-on: ubuntu-22.04
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build Android libraries
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export CC_armv7_linux_androideabi="$CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_armv7_linux_androideabi="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          PLATFORM=android ./scripts/build-mobile.sh dist/mobile
      - name: Archive Android artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}.tar.gz -C dist/mobile android include build-features.txt
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}.*

  harmony:
    if: vars.ENABLE_HARMONY_BUILD == 'true'
    runs-on: ubuntu-22.04
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos
      - name: Install OHOS NDK toolchain
        env:
          OHOS_NDK_URL: ${{ secrets.OHOS_NDK_URL }}
        run: |
          test -n "$OHOS_NDK_URL" || { echo "Configure repository secret OHOS_NDK_URL" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ohos-ndk"
          curl --fail --location "$OHOS_NDK_URL" --output "$RUNNER_TEMP/ohos-ndk.tar.gz"
          tar -xzf "$RUNNER_TEMP/ohos-ndk.tar.gz" -C "$RUNNER_TEMP/ohos-ndk" --strip-components=1
          test -x "$RUNNER_TEMP/ohos-ndk/native/llvm/bin/aarch64-linux-ohos-clang"
          echo "OHOS_NDK_HOME=$RUNNER_TEMP/ohos-ndk" >> "$GITHUB_ENV"
      - name: Build HarmonyOS libraries
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_NDK_HOME/native/llvm/bin/aarch64-linux-ohos-clang"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_NDK_HOME/native/llvm/bin/armv7-unknown-linux-ohos-clang"
          PLATFORM=harmony ./scripts/build-mobile.sh dist/mobile
      - name: Archive HarmonyOS artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}.tar.gz -C dist/mobile harmony include build-features.txt
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}.*
