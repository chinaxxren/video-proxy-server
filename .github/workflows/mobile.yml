name: mobile-native

on:
  workflow_dispatch:
    inputs:
      include_p2p:
        description: Build the explicitly optional P2P variant
        required: false
        default: false
        type: boolean
      include_librqbit:
        description: Build the optional Magnet/BitTorrent librqbit variant
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-14
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
      LIBRQBIT_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '1' || '0' }}
      LIBRQBIT_SUFFIX: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '-librqbit' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build iOS libraries
        run: PLATFORM=ios ./scripts/build-mobile.sh dist/mobile
      - name: Archive iOS artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz -C dist/mobile ios ios-sim include build-features.txt
          shasum -a 256 media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-ios${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-ios${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*

  android:
    runs-on: ubuntu-22.04
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
      LIBRQBIT_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '1' || '0' }}
      LIBRQBIT_SUFFIX: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '-librqbit' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build Android libraries
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export CC_armv7_linux_androideabi="$CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_armv7_linux_androideabi="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          PLATFORM=android ./scripts/build-mobile.sh dist/mobile
      - name: Package Android AAR
        run: ./scripts/package-android-aar.sh dist/mobile/android dist/mobile/android
      - name: Archive Android artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz -C dist/mobile android include build-features.txt
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-android${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-android${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*

  harmony:
    if: vars.ENABLE_HARMONY_BUILD == 'true'
    runs-on: ubuntu-22.04
    env:
      P2P_ENABLED: ${{ inputs.include_p2p && '1' || '0' }}
      P2P_SUFFIX: ${{ inputs.include_p2p && '-p2p' || '' }}
      LIBRQBIT_ENABLED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '1' || '0' }}
      LIBRQBIT_SUFFIX: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.include_librqbit) && '-librqbit' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos
      - name: Install OHOS NDK toolchain
        env:
          OHOS_NDK_URL: ${{ secrets.OHOS_NDK_URL }}
          OHOS_NDK_SHA256: ${{ secrets.OHOS_NDK_SHA256 }}
          OHOS_HVIGOR_URL: ${{ secrets.OHOS_HVIGOR_URL }}
          OHOS_HVIGOR_SHA256: ${{ secrets.OHOS_HVIGOR_SHA256 }}
        run: |
          test -n "$OHOS_NDK_URL" || { echo "Configure repository secret OHOS_NDK_URL" >&2; exit 1; }
          test -n "$OHOS_NDK_SHA256" || { echo "Configure repository secret OHOS_NDK_SHA256" >&2; exit 1; }
          test -n "$OHOS_HVIGOR_URL" || { echo "Configure repository secret OHOS_HVIGOR_URL" >&2; exit 1; }
          test -n "$OHOS_HVIGOR_SHA256" || { echo "Configure repository secret OHOS_HVIGOR_SHA256" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ohos-ndk"
          curl --fail --location "$OHOS_NDK_URL" --output "$RUNNER_TEMP/ohos-ndk.tar.gz"
          echo "$OHOS_NDK_SHA256  $RUNNER_TEMP/ohos-ndk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ohos-ndk.tar.gz" -C "$RUNNER_TEMP/ohos-ndk" --strip-components=1
          mkdir -p "$RUNNER_TEMP/ohos-hvigor"
          curl --fail --location "$OHOS_HVIGOR_URL" --output "$RUNNER_TEMP/ohos-hvigor.tar.gz"
          echo "$OHOS_HVIGOR_SHA256  $RUNNER_TEMP/ohos-hvigor.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ohos-hvigor.tar.gz" -C "$RUNNER_TEMP/ohos-hvigor" --strip-components=1
          HVIGORW_PATH="$(find "$RUNNER_TEMP/ohos-hvigor" -type f -name hvigorw -print -quit)"
          test -n "$HVIGORW_PATH" && test -x "$HVIGORW_PATH"
          echo "OHOS_NDK_HOME=$RUNNER_TEMP/ohos-ndk" >> "$GITHUB_ENV"
          echo "HVIGORW=$HVIGORW_PATH" >> "$GITHUB_ENV"
      - name: Build HarmonyOS libraries
        run: |
          LLVM_BIN="$OHOS_NDK_HOME/native/llvm/bin"
          AARCH64_CLANG="$(find "$LLVM_BIN" -maxdepth 1 -type f \( -name aarch64-unknown-linux-ohos-clang -o -name aarch64-linux-ohos-clang \) -print -quit)"
          ARMV7_CLANG="$(find "$LLVM_BIN" -maxdepth 1 -type f -name armv7-unknown-linux-ohos-clang -print -quit)"
          LLVM_AR="$LLVM_BIN/llvm-ar"
          LLVM_NM="$LLVM_BIN/llvm-nm"
          test -x "$AARCH64_CLANG" && test -x "$ARMV7_CLANG" && test -x "$LLVM_AR" && test -x "$LLVM_NM"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$AARCH64_CLANG"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_OHOS_LINKER="$ARMV7_CLANG"
          export CC_aarch64_unknown_linux_ohos="$AARCH64_CLANG"
          export CC_armv7_unknown_linux_ohos="$ARMV7_CLANG"
          export AR_aarch64_unknown_linux_ohos="$LLVM_AR"
          export AR_armv7_unknown_linux_ohos="$LLVM_AR"
          export NM="$LLVM_NM"
          PLATFORM=harmony ./scripts/build-mobile.sh dist/mobile
      - name: Package HarmonyOS HAR
        run: ./scripts/package-harmony-har.sh dist/mobile/harmony dist/mobile/harmony
      - name: Archive HarmonyOS artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz -C dist/mobile harmony include build-features.txt
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-harmony${P2P_SUFFIX}${LIBRQBIT_SUFFIX}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}
          path: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-harmony${{ env.P2P_SUFFIX }}${{ env.LIBRQBIT_SUFFIX }}.*
