name: mobile-native

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Test Swift adapter lifecycle
        run: ./scripts/test-ios-adapter.sh
      - name: Build iOS libraries
        run: PLATFORM=ios ./scripts/build-mobile.sh dist/mobile
      - name: Build iOS XCFramework and Swift adapter
        run: ./scripts/build-ios-xcframework.sh dist/mobile dist/ios-sdk
      - name: Archive iOS artifacts
        run: |
          ditto -c -k --norsrc --keepParent dist/ios-sdk media-proxy-cache-${GITHUB_REF_NAME}-ios.zip
          shasum -a 256 media-proxy-cache-${GITHUB_REF_NAME}-ios.zip > media-proxy-cache-${GITHUB_REF_NAME}-ios.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-ios
          path: media-proxy-cache-${{ github.ref_name }}-ios.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-ios.*

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build Android libraries
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export CC_armv7_linux_androideabi="$CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
          export CC_x86_64_linux_android="$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_armv7_linux_androideabi="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          PLATFORM=android ./scripts/build-mobile.sh dist/mobile
      - name: Build and test Android AAR
        run: ./scripts/build-android-aar.sh dist/mobile dist/android-sdk
      - name: Verify Android AAR contents
        run: |
          unzip -l dist/android-sdk/media-proxy-cache.aar > aar-contents.txt
          for entry in \
            classes.jar \
            jni/arm64-v8a/libproxy_server.so \
            jni/arm64-v8a/libmedia_proxy_cache_jni.so \
            jni/armeabi-v7a/libproxy_server.so \
            jni/armeabi-v7a/libmedia_proxy_cache_jni.so \
            jni/x86_64/libproxy_server.so \
            jni/x86_64/libmedia_proxy_cache_jni.so; do
            grep -Fq "$entry" aar-contents.txt || { echo "Missing AAR entry: $entry" >&2; exit 1; }
          done
      - name: Archive Android artifacts
        run: |
          cp dist/android-sdk/media-proxy-cache.aar media-proxy-cache-${GITHUB_REF_NAME}-android.aar
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-android.aar > media-proxy-cache-${GITHUB_REF_NAME}-android.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-android
          path: media-proxy-cache-${{ github.ref_name }}-android.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-android.*

  harmony:
    if: vars.ENABLE_HARMONY_BUILD == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos,armv7-unknown-linux-ohos
      - name: Install OHOS NDK toolchain
        env:
          OHOS_NDK_URL: ${{ secrets.OHOS_NDK_URL }}
        run: |
          test -n "$OHOS_NDK_URL" || { echo "Configure repository secret OHOS_NDK_URL" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ohos-ndk"
          curl --fail --location "$OHOS_NDK_URL" --output "$RUNNER_TEMP/ohos-ndk.tar.gz"
          tar -xzf "$RUNNER_TEMP/ohos-ndk.tar.gz" -C "$RUNNER_TEMP/ohos-ndk" --strip-components=1
          test -x "$RUNNER_TEMP/ohos-ndk/native/llvm/bin/aarch64-linux-ohos-clang"
          echo "OHOS_NDK_HOME=$RUNNER_TEMP/ohos-ndk" >> "$GITHUB_ENV"
      - name: Build HarmonyOS libraries
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_NDK_HOME/native/llvm/bin/aarch64-linux-ohos-clang"
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_OHOS_LINKER="$OHOS_NDK_HOME/native/llvm/bin/armv7-unknown-linux-ohos-clang"
          PLATFORM=harmony ./scripts/build-mobile.sh dist/mobile
      - name: Archive HarmonyOS artifacts
        run: |
          tar -czf media-proxy-cache-${GITHUB_REF_NAME}-harmony.tar.gz -C dist/mobile harmony include
          sha256sum media-proxy-cache-${GITHUB_REF_NAME}-harmony.tar.gz > media-proxy-cache-${GITHUB_REF_NAME}-harmony.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: media-proxy-cache-${{ github.ref_name }}-harmony
          path: media-proxy-cache-${{ github.ref_name }}-harmony.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ github.ref_name }}-harmony.*
