name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/verify-release-version.sh
        shell: bash
      - run: cargo build --locked --release
      - name: Collect Unix artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release/include
          cp include/media_proxy_cache.h release/include/
          cp target/release/proxy-server release/
          cp target/release/libproxy_server.a release/ 2>/dev/null || true
          cp target/release/libproxy_server.dylib release/ 2>/dev/null || true
          cp target/release/libproxy_server.so release/ 2>/dev/null || true
          tar -czf media-proxy-cache-${{ matrix.name }}.tar.gz -C release .
          if command -v sha256sum >/dev/null 2>&1; then sha256sum media-proxy-cache-${{ matrix.name }}.tar.gz > media-proxy-cache-${{ matrix.name }}.sha256; else shasum -a 256 media-proxy-cache-${{ matrix.name }}.tar.gz > media-proxy-cache-${{ matrix.name }}.sha256; fi
      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/include
          Copy-Item include/media_proxy_cache.h release/include/
          Copy-Item target/release/proxy-server.exe release/
          Copy-Item target/release/proxy_server.dll release/ -ErrorAction SilentlyContinue
          Copy-Item target/release/proxy_server.dll.lib release/ -ErrorAction SilentlyContinue
          Compress-Archive -Path release/* -DestinationPath media-proxy-cache-${{ matrix.name }}.zip
          (Get-FileHash media-proxy-cache-${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower() + "  media-proxy-cache-${{ matrix.name }}.zip" | Out-File -Encoding ascii media-proxy-cache-${{ matrix.name }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: media-proxy-cache-${{ matrix.name }}
          path: media-proxy-cache-${{ matrix.name }}.*
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: media-proxy-cache-${{ matrix.name }}.*
