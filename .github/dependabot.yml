version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # napi-h 2.16 is a HarmonyOS fork of the N-API 2.x runtime. The 3.x
      # derive macros generate calls and traits that this runtime does not expose.
      - dependency-name: napi-derive
        update-types:
          - version-update:semver-major
    groups:
      rust-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
