name: MediaProxyCachePlayerPOC
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.MediaProxyCachePlayerPOC
    CODE_SIGNING_ALLOWED: NO
targets:
  MediaProxyCachePlayerPOC:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../platform/ios/MediaProxyCache.swift
      - path: ../../aa.mp4
        buildPhase: resources
    dependencies:
      - framework: ../../dist/ios-player-poc/ios/MediaProxyCache.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Proxy Player
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
