[package]
name = "proxy-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []

# **仅供本机测试**：允许回源到私网/环回地址。
#
# 生产构建绝不能开。默认关闭意味着发布产物里根本不存在这段代码，而不是
# 靠一个运行时开关——运行时开关会被配置文件、环境变量、误传的参数打开。
#
# 存在的理由：端到端测试需要一个跑在 127.0.0.1 上的假上游。没有这个开关，
# 任何本机源站都会被 `NetworkPolicy::validate` 挡在门外，于是「完整 HTTP
# 集成测试」就只能对着真实公网地址跑——那种测试既慢又不稳定，还测不了
# 上游故障注入。
#
# 开启后 `NetworkPolicy` 会在首次校验时往 stderr 打一行醒目警告，
# 避免它被悄悄编进不该开的产物里。
allow-private-upstream = []

# feature 按实际用到的收窄，不用 "full"。
#
# `tokio = ["full"]` 会带上 process、signal、io-std 等本项目完全不碰的模块，
# `hyper = ["full"]` 同理。对桌面构建只是多编一会儿，但这个 crate 要往
# iOS/Android 上搬的话，包体积和构建时间都是直接成本。
[dependencies]
hyper = { version = "0.14", features = [
    "client",
    "server",
    "http1",
    "http2",
    # Body 要当 Stream 用（handlers/network.rs 直接 map 它）。
    "stream",
    "runtime",
    "tcp",
] }
tokio = { version = "1.0", features = [
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }
futures = "0.3"
bytes = "1.0"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
hyper-tls = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.2"
urlencoding = "2.1.0"
m3u8-rs = "5.0"
async-trait = "0.1"
md5 = "0.7"
tokio-stream = "0.1"

[dev-dependencies]
# test-util 提供 tokio::time::pause/advance，TTL 相关的测试靠它免去真实等待。
tokio = { version = "1.0", features = ["test-util"] }
tempfile = "3"
# 只有 examples 在用（hls_test、mixed_source_test），不该进主依赖：
# 它自己会再拖一份 native-tls 和一整套 HTTP 栈。
reqwest = "0.11"
