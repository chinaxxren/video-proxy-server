[package]
name = "proxy-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []

# **仅供本机测试**：允许回源到私网/环回地址。
#
# 生产构建绝不能开。默认关闭意味着发布产物里根本不存在这段代码，而不是
# 靠一个运行时开关——运行时开关会被配置文件、环境变量、误传的参数打开。
#
# 存在的理由：端到端测试需要一个跑在 127.0.0.1 上的假上游。没有这个开关，
# 任何本机源站都会被 `NetworkPolicy::validate` 挡在门外，于是「完整 HTTP
# 集成测试」就只能对着真实公网地址跑——那种测试既慢又不稳定，还测不了
# 上游故障注入。
#
# 开启后 `NetworkPolicy` 会在首次校验时往 stderr 打一行醒目警告，
# 避免它被悄悄编进不该开的产物里。
allow-private-upstream = []

# feature 按实际用到的收窄，不用 "full"。
#
# `tokio = ["full"]` 会带上 process、signal、io-std 等本项目完全不碰的模块，
# `hyper = ["full"]` 同理。对桌面构建只是多编一会儿，但这个 crate 要往
# iOS/Android 上搬的话，包体积和构建时间都是直接成本。
[dependencies]
tokio = { version = "1.0", default-features = false, features = [
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = { version = "1.0", default-features = false, features = ["std"] }
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "server-graceful", "http1", "tokio"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http-body-util = { version = "0.1", default-features = false }
tower-service = { version = "0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
url = { version = "2.2", default-features = false, features = ["std"] }
m3u8-rs = { version = "6.0.1", default-features = false, features = ["parser"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# test-util 提供 tokio::time::pause/advance，TTL 相关的测试靠它免去真实等待。
tokio = { version = "1.0", default-features = false, features = ["test-util"] }
tempfile = "3"
